<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário</title>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://alcdn.msauth.net/browser/2.19.0/js/msal-browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="nav-btn" onclick="prevMonth()">&#9665;</button>
            <h2 id="monthYear"></h2>
            <button class="nav-btn" onclick="nextMonth()">&#9655;</button>
        </div>

        <div class="buttons">
            <button onclick="authenticateGoogle()">📅 Google</button>
            <button onclick="authenticateMicrosoft()">📅 Microsoft</button>
        </div>

        <div class="calendar" id="calendar"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
