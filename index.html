<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário</title>
    <link rel="stylesheet" href="style.css"> <!-- Conectando o CSS para estilizar a página -->
</head>
<body>

    <!-- Cabeçalho com os botões de navegação -->
    <div class="header">
        <button id="prevMonth">◀</button> <!-- Botão para voltar um mês -->
        <h1 id="monthYear"></h1> <!-- Título que mostra o mês e o ano atual -->
        <button id="nextMonth">▶</button> <!-- Botão para avançar um mês -->
    </div>

    <!-- Botões para integração com Google e Microsoft -->
    <div class="calendar-buttons">
        <button id="googleBtn">Google</button>
        <button id="microsoftBtn">Microsoft</button>
    </div>

    <!-- Área onde o calendário será gerado dinamicamente via JavaScript -->
    <div class="calendar" id="calendar"></div>

    <script src="script.js"></script> <!-- Conectando o JavaScript para adicionar funcionalidades -->
</body>
</html>
